<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"
    />

    <link rel="icon" href="data:," />
    <title>UMD test</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/quasar@^2.0.0/dist/quasar.prod.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="dist/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="q-app">
      <q-layout view="lHh Lpr fff">
        <q-header class="glossy bg-primary">
          <q-toolbar>
            <q-toolbar-title> QFlashcard v{{ version }} </q-toolbar-title>

            <div>Quasar v{{ $q.version }}</div>
          </q-toolbar>
        </q-header>

        <q-page-container>
          <q-page padding>
            <q-flashcard>
              <q-flashcard-section active transition="flip-left">
                <q-card class="bg-primary text-white">
                  <q-card-section> QFlashcard UMD smoke test </q-card-section>
                </q-card>
              </q-flashcard-section>
            </q-flashcard>
          </q-page>
        </q-page-container>
      </q-layout>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@^3.0.0/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@^2.0.0/dist/quasar.umd.prod.js"></script>
    <script src="dist/index.umd.js"></script>

    <script>
      const flashcardPlugin = globalThis.QFlashcard;
      const bundleReady =
        flashcardPlugin !== void 0 &&
        typeof flashcardPlugin.install === "function" &&
        flashcardPlugin.QFlashcard !== void 0 &&
        flashcardPlugin.QFlashcardSection !== void 0;

      const app = Vue.createApp({
        setup() {
          return {
            version: bundleReady === true ? flashcardPlugin.version : "bundle missing",
          };
        },
      });

      app.use(Quasar);
      if (bundleReady === true) {
        app.use(flashcardPlugin);
      }
      app.mount("#q-app");
    </script>
  </body>
</html>
